spring.application.name= ZexploreTravel Planner
spring.cloud.config.enabled=false

ADMIN_EMAIL=admin@zexplore.com
ADMIN_PASSWORD=Admin@123

jwt.secret=CHANGE_THIS_TO_A_256_BIT_SECRET_STRING
jwt.expiration-ms=86400000

server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/zexplore
spring.datasource.username=root
spring.datasource.password=root

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration (if you're using Spring Data JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
